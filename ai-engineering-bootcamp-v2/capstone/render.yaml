# Deploy target for the capstone. Mirrors the week-5 service, with one
# difference that matters: this app never writes.
#
# Week 5's service needed Postgres because its whole subject was durable memory
# on a host with no persistent disk. This one reads precomputed traces and a
# calibration file, both committed, so a free instance waking with an empty
# filesystem loses nothing. The live "check a claim" tab uses a throwaway SQLite
# store it does not care about keeping.
services:
  - type: web
    name: capstone-claim-auditor
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/capstone
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false        # set in the Render dashboard, never committed
      - key: SEC_USER_AGENT
        sync: false        # the SEC requires a name and email on every request
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: PYTHON_VERSION
        value: 3.13.0
