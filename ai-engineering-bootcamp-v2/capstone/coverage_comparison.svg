 .h2{font:11.5px ui-sans-serif,system-ui,sans-serif;fill:#52514e}
 @media (prefers-color-scheme:dark){
   .grid{stroke:#2c2c2a} .ghost{stroke:#3f3f3c}
   .own{stroke:#03a290} .dot{fill:#03a290} .end{fill:#03a290}
   .tick,.h2{fill:#c3c2b7} .pt,.h1{fill:#ffffff}
 }</style>
 <text x="40" y="20" class="h1">Share of numeric claims with a matching filed concept, by bank</text>
 <text x="40" y="36" class="h2">The other four banks are grey behind each panel.</text>
 <text x="40" y="50" class="h2">Levels are not comparable across panels &#8212; retrieval was tuned on JPMorgan, so a bank
 we read badly and a bank that genuinely tags less look the same.</text>
