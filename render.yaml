# Render deployment for the bootcamp APIs — one service per week.
#
# Committed rather than clicked into the dashboard so the configuration is
# recoverable: a service rebuilt from memory six weeks from now is a service
# with subtly different settings.
#
# Deploy with:  Render dashboard -> New -> Blueprint -> pick this repo.
#
# Separate services rather than one, because on Render the service name *is* the
# public hostname. Renaming week1-ask-api to something clearer would have
# retired week1-ask-api.onrender.com, which is the URL already submitted for
# Week 1 — so a grader revisiting that link would find nothing. Instead week 1
# keeps its name and its URL, and week 2 gets its own.
#
#   week1-ask-api.onrender.com   -> ai-engineering-bootcamp-v2/week-1
#   week2-rag-api.onrender.com   -> ai-engineering-bootcamp-v2/week-2
#   week2-rag-ui.onrender.com    -> ai-engineering-bootcamp-v2/week-2  (same folder)
#
# The UI and the API are two services out of one folder. They are separate
# because they are separate programs: the API answers machines and holds the
# keys; the UI answers people and holds none. Running them together would put
# the keys inside a page the public can load.

services:
  # ---------------------------------------------------------------- week 1 ---
  # Frozen at what was submitted. Restored here after Week 2 work temporarily
  # repointed it; the URL in the Week 1 submission serves the Week 1 app again.
  - type: web
    name: week1-ask-api
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ---------------------------------------------------------------- week 2 ---
  - type: web
    name: week2-rag-api
    runtime: python
    plan: free

    # The repo holds several courses; only this folder is the deployable app.
    # Build and start commands run relative to it, which is why they can say
    # "requirements.txt" and "main.py" with no path.
    rootDir: ai-engineering-bootcamp-v2/week-2

    buildCommand: pip install -r requirements.txt

    # 0.0.0.0, not 127.0.0.1: the container must accept connections from
    # outside itself. $PORT is assigned by Render at boot — hardcoding 8000
    # means the health check never finds the app and the deploy hangs.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      # sync: false means "prompt for this in the dashboard, never store it
      # here". The key stays out of git; Render injects it at runtime, where
      # load_dotenv() finds no .env, shrugs, and OpenAI() reads the real
      # environment instead. Same code path locally and in production.
      #
      # The trap: a sync: false variable left blank in the dashboard still
      # deploys successfully, and then fails on the first request. That is what
      # GET /health/pinecone exists to diagnose in one step.
      - key: OPENAI_API_KEY
        sync: false

      # Week 2. The only new secret — Pinecone's key. Everything else below is
      # configuration, not credentials, so it is written here in full where it
      # is reviewable and version-controlled.
      - key: PINECONE_API_KEY
        sync: false

      # Which index to use. Must match the index that was actually created, and
      # that index is permanently sized for the embedding model below.
      - key: PINECONE_INDEX_NAME
        value: week2-rag

      # The embedding model, named once and used for both storing documents and
      # searching them. If this ever disagrees with the model the index was
      # built for, retrieval returns coordinates computed in a different space:
      # no error anywhere, just results that are quietly meaningless.
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      # Chunking defaults. Overridable per request on POST /ingest.
      #
      # 400 rather than the 800 originally guessed, because a chunking
      # experiment measured 800 as the worst of the three sizes tried. At 800
      # the WB-9 speed qualifier shares a chunk with the payload and battery
      # notes, so its embedding averages three topics and ranks poorly on a
      # question about speed. At 400 it gets a chunk to itself. At 1600 it is
      # still blended, but five chunks cover 83% of that document so it is
      # retrieved anyway. 400 also costs ~35% less per query than 800.
      - key: CHUNK_SIZE
        value: "400"

      - key: CHUNK_OVERLAP
        value: "50"

      # Pinned so a Render default bump cannot change the runtime underneath
      # a working deploy. Matches the local .venv.
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ------------------------------------------------------------- week 2 UI ---
  # The Streamlit page. Same folder and same requirements.txt as the API above,
  # but a different program started from it — so it needs its own service.
  #
  # Note what is NOT here: no OPENAI_API_KEY, no PINECONE_API_KEY. The UI never
  # talks to OpenAI or Pinecone. It sends an HTTP request to the API service and
  # renders whatever comes back. That is why this page can be public with no
  # secrets to leak, and it is worth keeping that way — the moment a key appears
  # in this block, the design has gone wrong.
  - type: web
    name: week2-rag-ui
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-2
    buildCommand: pip install -r requirements.txt

    # --server.address 0.0.0.0 for the same reason uvicorn needs it above: the
    # container must accept connections from outside itself.
    #
    # --server.port $PORT because Render assigns the port at boot. Streamlit's
    # default of 8501 would leave the health check knocking on an empty door.
    #
    # --server.headless true stops Streamlit from trying to open a browser and
    # from printing its first-run email prompt. On a server there is no browser
    # and nobody to answer the prompt, and the boot hangs waiting.
    startCommand: >
      streamlit run streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    envVars:
      # Which API this page talks to. streamlit_app.py already defaults to this
      # URL in code, but setting it here means the page can be repointed from
      # the dashboard without a commit — and it documents the dependency where
      # someone reading the deployment config will see it.
      - key: API_BASE_URL
        value: https://week2-rag-api.onrender.com

      - key: PYTHON_VERSION
        value: "3.12.3"
