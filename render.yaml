# Render deployment for the bootcamp APIs — one service per week.
#
# Committed rather than clicked into the dashboard so the configuration is
# recoverable: a service rebuilt from memory six weeks from now is a service
# with subtly different settings.
#
# Deploy with:  Render dashboard -> New -> Blueprint -> pick this repo.
#
# Separate services rather than one, because on Render the service name *is* the
# public hostname. Renaming week1-ask-api to something clearer would have
# retired week1-ask-api.onrender.com, which is the URL already submitted for
# Week 1 — so a grader revisiting that link would find nothing. Instead week 1
# keeps its name and its URL, and week 2 gets its own.
#
#   week1-ask-api.onrender.com   -> ai-engineering-bootcamp-v2/week-1
#   week2-rag-api.onrender.com   -> ai-engineering-bootcamp-v2/week-2
#   week2-rag-ui.onrender.com    -> ai-engineering-bootcamp-v2/week-2  (same folder)
#
# The UI and the API are two services out of one folder. They are separate
# because they are separate programs: the API answers machines and holds the
# keys; the UI answers people and holds none. Running them together would put
# the keys inside a page the public can load.

services:
  # ---------------------------------------------------------------- week 1 ---
  # Frozen at what was submitted. Restored here after Week 2 work temporarily
  # repointed it; the URL in the Week 1 submission serves the Week 1 app again.
  - type: web
    name: week1-ask-api
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ---------------------------------------------------------------- week 2 ---
  - type: web
    name: week2-rag-api
    runtime: python
    plan: free

    # The repo holds several courses; only this folder is the deployable app.
    # Build and start commands run relative to it, which is why they can say
    # "requirements.txt" and "main.py" with no path.
    rootDir: ai-engineering-bootcamp-v2/week-2

    buildCommand: pip install -r requirements.txt

    # 0.0.0.0, not 127.0.0.1: the container must accept connections from
    # outside itself. $PORT is assigned by Render at boot — hardcoding 8000
    # means the health check never finds the app and the deploy hangs.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      # sync: false means "prompt for this in the dashboard, never store it
      # here". The key stays out of git; Render injects it at runtime, where
      # load_dotenv() finds no .env, shrugs, and OpenAI() reads the real
      # environment instead. Same code path locally and in production.
      #
      # The trap: a sync: false variable left blank in the dashboard still
      # deploys successfully, and then fails on the first request. That is what
      # GET /health/pinecone exists to diagnose in one step.
      - key: OPENAI_API_KEY
        sync: false

      # Week 2. The only new secret — Pinecone's key. Everything else below is
      # configuration, not credentials, so it is written here in full where it
      # is reviewable and version-controlled.
      - key: PINECONE_API_KEY
        sync: false

      # Which index to use. Must match the index that was actually created, and
      # that index is permanently sized for the embedding model below.
      - key: PINECONE_INDEX_NAME
        value: week2-rag

      # The embedding model, named once and used for both storing documents and
      # searching them. If this ever disagrees with the model the index was
      # built for, retrieval returns coordinates computed in a different space:
      # no error anywhere, just results that are quietly meaningless.
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      # Chunking defaults. Overridable per request on POST /ingest.
      #
      # 400 rather than the 800 originally guessed, because a chunking
      # experiment measured 800 as the worst of the three sizes tried. At 800
      # the WB-9 speed qualifier shares a chunk with the payload and battery
      # notes, so its embedding averages three topics and ranks poorly on a
      # question about speed. At 400 it gets a chunk to itself. At 1600 it is
      # still blended, but five chunks cover 83% of that document so it is
      # retrieved anyway. 400 also costs ~35% less per query than 800.
      - key: CHUNK_SIZE
        value: "400"

      - key: CHUNK_OVERLAP
        value: "50"

      # Pinned so a Render default bump cannot change the runtime underneath
      # a working deploy. Matches the local .venv.
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ------------------------------------------------------------- week 2 UI ---
  # The Streamlit page. Same folder and same requirements.txt as the API above,
  # but a different program started from it — so it needs its own service.
  #
  # Note what is NOT here: no OPENAI_API_KEY, no PINECONE_API_KEY. The UI never
  # talks to OpenAI or Pinecone. It sends an HTTP request to the API service and
  # renders whatever comes back. That is why this page can be public with no
  # secrets to leak, and it is worth keeping that way — the moment a key appears
  # in this block, the design has gone wrong.
  - type: web
    name: week2-rag-ui
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-2
    buildCommand: pip install -r requirements.txt

    # --server.address 0.0.0.0 for the same reason uvicorn needs it above: the
    # container must accept connections from outside itself.
    #
    # --server.port $PORT because Render assigns the port at boot. Streamlit's
    # default of 8501 would leave the health check knocking on an empty door.
    #
    # --server.headless true stops Streamlit from trying to open a browser and
    # from printing its first-run email prompt. On a server there is no browser
    # and nobody to answer the prompt, and the boot hangs waiting.
    startCommand: >
      streamlit run streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    envVars:
      # Which API this page talks to. streamlit_app.py already defaults to this
      # URL in code, but setting it here means the page can be repointed from
      # the dashboard without a commit — and it documents the dependency where
      # someone reading the deployment config will see it.
      - key: API_BASE_URL
        value: https://week2-rag-api.onrender.com

      - key: PYTHON_VERSION
        value: "3.12.3"

  # ------------------------------------------------------------------ week 3 ---
  # The SEC Claim Auditor — a Google ADK agent with a Streamlit front end.
  #
  # One service, not two. Weeks 1 and 2 split the API from the UI so that the
  # page could be public while the keys stayed server-side. That split is not
  # available here: the agent runs inside the Streamlit process, so this service
  # necessarily holds GOOGLE_API_KEY. It is set sync: false, so the value lives
  # in the Render dashboard and never in this file — but the page and the key
  # are in the same process, and that is a real difference from week 2.
  #
  # The tool this agent calls, data.sec.gov, needs no key at all. It is free and
  # public. The only credential in the whole week is the one for Gemini.
  - type: web
    name: week3-sec-auditor
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-3
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    envVars:
      # Which engine ADK drives. Still Google ADK either way — same Agent, same
      # tool, same event stream — but Gemini's free tier allows only twenty
      # requests per day per model, about five audits, which a public page
      # exhausts in minutes. The OpenAI key is already on billing from Week 1.
      #
      # Set this to "gemini" in the dashboard to demonstrate the agent running
      # on Google's own stack. No redeploy of code is needed.
      - key: LLM_PROVIDER
        value: openai

      # gpt-4o, not gpt-4o-mini, on measured evidence: mini made a single
      # lookup on the JPMorgan managed-basis claim and returned CONTRADICTED,
      # which is wrong. gpt-4o and gemini-3.5-flash both made two lookups and
      # both reached DEFINITION_MISMATCH. See week-3/README.md.
      - key: OPENAI_MODEL
        value: gpt-4o

      # Same key as week1-ask-api and week2-rag-api. Used only when
      # LLM_PROVIDER is openai.
      - key: OPENAI_API_KEY
        sync: false

      # Used only when LLM_PROVIDER is gemini. Leaving it blank is fine while
      # the service runs on OpenAI.
      - key: GOOGLE_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      # The SEC refuses requests that do not say who is making them. This is a
      # return address rather than a secret, so it is written here in full.
      - key: SEC_USER_AGENT
        value: Tharaka Jayalath taj.aravinda@gmail.com

      - key: PYTHON_VERSION
        value: "3.12.3"

  # ----------------------------------------------------------------- week 4 ---
  # The evaluation dashboard for the Week 3 agent: twenty recorded runs, three
  # code checks, and the before/after comparison of an instruction rewrite.
  #
  # NO SECRETS, and that is a property of the program rather than a precaution.
  # This page reads JSONL files committed alongside it and grades them with
  # checks.py, which is arithmetic and string matching. It never calls a model
  # and never opens a socket. There is no key to set here because there is
  # nothing for a key to unlock — closer to week2-rag-ui than to
  # week3-sec-auditor, which necessarily holds a key because the agent runs
  # inside its Streamlit process.
  #
  # It also installs requirements-dashboard.txt rather than requirements.txt.
  # The full list brings in google-adk and litellm for an agent this service
  # never starts; the slim one is streamlit alone, verified by walking the
  # import graph. Faster build, and a container with no way to reach OpenAI or
  # data.sec.gov cannot spend money however it is poked from the internet.
  #
  # What is deliberately NOT deployed: open_coding.py, the annotation bench.
  # It writes the human notes back into traces.jsonl, and on Render the disk is
  # ephemeral and shared by every visitor — so published notes would be both
  # editable by strangers and lost on the next deploy. Reading the traces is a
  # public act; annotating them is not.
  - type: web
    name: week4-evals
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-4
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: >
      streamlit run evals_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ----------------------------------------------------------------- week 5 ---
  # The Week 3 auditor again, with durable memory added.
  #
  # A separate service rather than a redeploy of week3-sec-auditor, for the
  # reason set out at the top of this file: on Render the service name is the
  # public hostname, and week3-sec-auditor.onrender.com is a URL already
  # submitted. A grader revisiting it should find the thing that was graded.
  #
  # THE VARIABLE THAT DECIDES WHETHER THIS ASSIGNMENT PASSES
  #
  # DATABASE_URL. Without it the app does not crash — it falls back to SQLite on
  # the container's local disk, works perfectly for as long as anyone is
  # watching, and forgets everything the moment the free instance sleeps after
  # fifteen minutes idle. Every local test would still be green. The deployed
  # page would quietly fail the one property the week is about.
  #
  # That is the same trap this file already documents for a blank sync: false
  # key, but worse, because a missing key produces an error on the first request
  # and a missing DATABASE_URL produces a page that looks entirely fine. The
  # sidebar therefore names the store in use and warns in orange when it is not
  # Postgres, so a screenshot of this page is self-evidencing: it says which
  # store the run it is showing actually wrote to.
  #
  # The value is a Supabase Postgres connection string, set in the dashboard.
  # Supabase rather than a Render database because Render's free Postgres expires
  # after 30 days, and this URL is meant to survive as a portfolio link.
  #
  # No migration step: MemoryStore.ensure_schema() runs CREATE TABLE IF NOT
  # EXISTS on first use, so an empty database is a working database.
  - type: web
    name: week5-memory-auditor
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/week-5
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    envVars:
      # Week 5's addition. Everything else below is carried over from week 3.
      - key: DATABASE_URL
        sync: false

      # Who the stored preferences and aliases belong to. There is no login on
      # this page, so every visitor shares one identity — which is honest for a
      # demo and is stated in the README rather than hidden. Tag facts are shared
      # regardless of this value, because the only way to write one is for the
      # SEC to have returned it.
      - key: MEMORY_USER_ID
        value: public-demo

      - key: LLM_PROVIDER
        value: openai

      # gpt-4o, not gpt-4o-mini, on measured evidence from week 3: mini made a
      # single lookup on the JPMorgan managed-basis claim and returned
      # CONTRADICTED, which is wrong.
      - key: OPENAI_MODEL
        value: gpt-4o

      - key: OPENAI_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: SEC_USER_AGENT
        value: Tharaka Jayalath taj.aravinda@gmail.com

      # Pinned to match every other service here. Note that the local venv for
      # this folder is 3.13, as week 4's is — a drift recorded in week-5's README
      # under known limits rather than left to be discovered during a build.
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ---------------------------------------------------------------------------
  # Capstone — the Calibrated Claim Auditor.
  #
  # Unlike week 5, this service never writes. The filing reports it serves are
  # precomputed into traces.jsonl and calibration.json, both committed, so a free
  # instance waking from sleep with an empty filesystem loses nothing and no
  # Postgres is needed. Week 5 needed DATABASE_URL because durable memory was its
  # entire subject; here memory is deliberately switched off, so that the fifty
  # evaluation runs stay independent of one another.
  #
  # The "Check a claim" tab does run the agent live and therefore needs
  # OPENAI_API_KEY. The filing report does not — if the key were missing, the
  # mandatory part of the demo would still work for a visitor.
  # ---------------------------------------------------------------------------
  - type: web
    name: capstone-claim-auditor
    runtime: python
    plan: free
    rootDir: ai-engineering-bootcamp-v2/capstone
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    envVars:
      - key: LLM_PROVIDER
        value: openai

      # Same reasoning as week 3 onwards: gpt-4o-mini answered CONTRADICTED on
      # the JPMorgan managed-basis claim, which is the wrong verdict.
      - key: OPENAI_MODEL
        value: gpt-4o

      - key: OPENAI_API_KEY
        sync: false

      # The SEC refuses requests that do not identify who is making them. Not a
      # secret — closer to a return address — so it is set here rather than in
      # the dashboard, and a deploy needs only the API key entered by hand.
      - key: SEC_USER_AGENT
        value: Tharaka Jayalath taj.aravinda@gmail.com

      - key: PYTHON_VERSION
        value: "3.12.3"
